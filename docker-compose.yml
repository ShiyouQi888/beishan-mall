# 显式指定项目名：目录名是中文时 compose 会推导出空名并直接报错
name: beishan-mall

services:
  mall:
    build:
      context: .
      dockerfile: Dockerfile
    image: beishan-mall:latest
    container_name: beishan-mall
    restart: unless-stopped
    ports:
      # 宿主机端口不写死：留空则由 Docker 分配一个空闲端口，避免和本机其它服务抢 3300。
      # 冒号左边是宿主机端口，为空就是「自动分配」；右边是容器内端口（由 PORT 决定）。
      # 想固定：在 .env 里写 APP_PORT=3300
      - "${APP_PORT:-}:${PORT:-3300}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # 容器内监听端口，改了这里映射会自动跟着变（健康检查也读同一个变量）
      PORT: ${PORT:-3300}
      MALL_DB: /app/data/mall.db
      UPLOAD_DIR: /app/data/uploads
      PUBLIC_DIR: /app/public
      # 反向代理/CDN 场景想让图片返回绝对地址时填这里，例如 https://mall.example.com
      # 留空则返回相对路径（同源部署最稳）
      PUBLIC_BASE_URL: ""
      # 生产环境务必改成自己的密钥
      JWT_SECRET: "please-change-this-secret"
      # 内置管理员账号：首次启动自动创建；账号已存在时不会覆盖密码
      # 忘记密码时把 ADMIN_PASSWORD_RESET 设为 "1" 重启一次，改完再改回
      ADMIN_USER: "admin1"
      ADMIN_PASSWORD: "please-change-this-password"
      ADMIN_PASSWORD_RESET: "0"
      TZ: Asia/Shanghai
    volumes:
      # SQLite 数据库 + 上传文件，删容器不丢数据
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
